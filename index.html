<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TCG 箱買い期待値シミュレーター</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    .chev { transition: transform .2s; }
    .collapsed .chev { transform: rotate(-90deg); }
    .collapsed .body { display: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <header class="bg-indigo-600 text-white sticky top-0 z-20 shadow">
    <h1 class="px-4 pt-3 text-lg font-bold">TCG 箱買い期待値シミュレーター</h1>
    <nav class="flex mt-2">
      <button data-tab="sim" class="tab-btn flex-1 py-2 text-sm font-semibold border-b-4">シミュレーション</button>
      <button data-tab="hist" class="tab-btn flex-1 py-2 text-sm font-semibold border-b-4">履歴 <span id="histCount" class="text-xs bg-white/25 rounded-full px-2">0</span></button>
      <button data-tab="set" class="tab-btn flex-1 py-2 text-sm font-semibold border-b-4">設定・バックアップ</button>
    </nav>
  </header>

  <!-- シミュレーション画面 -->
  <main id="view-sim" class="p-3 pb-72 max-w-2xl mx-auto space-y-4">
    <section class="bg-white rounded-xl shadow p-4 space-y-3">
      <h2 class="font-bold text-indigo-700">① ボックスの基本設定</h2>
      <label class="block text-sm">商品名（ボックス名）
        <input data-bind="meta.name" type="text" list="nameList" placeholder="例: ○○ 拡張パック BOX" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-base">
        <datalist id="nameList"></datalist>
      </label>
      <label class="block text-sm">1箱の購入価格（円）
        <input data-bind="box.price" type="number" pattern="\d*" inputmode="numeric" min="0" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-base">
      </label>
      <label class="block text-sm">未開封ボックスの現在のフリマ相場（円）
        <input data-bind="box.flea" type="number" pattern="\d*" inputmode="numeric" min="0" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-base">
      </label>
      <label class="block text-sm">開封する箱数
        <input data-bind="box.count" type="number" pattern="\d*" inputmode="numeric" min="1" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-base">
      </label>
    </section>

    <section class="bg-white rounded-xl shadow p-4 space-y-3">
      <h2 class="font-bold text-indigo-700">② 販売コスト設定（フリマ）</h2>
      <div class="grid grid-cols-2 gap-3">
        <label class="block text-sm">手数料（%）
          <input data-bind="cost.fee" type="number" pattern="\d*" inputmode="numeric" min="0" max="100" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-base">
        </label>
        <label class="block text-sm">送料・梱包費（円/件）
          <input data-bind="cost.ship" type="number" pattern="\d*" inputmode="numeric" min="0" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-base">
        </label>
      </div>
    </section>

    <section class="space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="font-bold text-indigo-700">③ レアリティ枠の封入仕様</h2>
        <button id="addRarity" class="bg-indigo-600 text-white text-sm rounded-lg px-4 py-2 active:bg-indigo-700">＋追加</button>
      </div>
      <p class="text-xs text-slate-500">※「全種類数」は通常排出（均等）の種類数です。「◯箱に1枚」で確率指定したハイレアは含めないでください。</p>
      <div id="rarities" class="space-y-4"></div>
    </section>

    <section class="bg-white rounded-xl shadow p-4 space-y-3">
      <h2 class="font-bold text-indigo-700">④ この結果を履歴に保存</h2>
      <label class="block text-sm">シミュレーション日（相場の時点）
        <input data-bind="meta.date" type="date" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-base">
      </label>
      <label class="block text-sm">メモ（任意）
        <textarea data-bind="meta.memo" rows="2" placeholder="例: 発売直後の相場。SARは予約価格" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-base"></textarea>
      </label>
      <button id="btnSnapshot" class="w-full bg-emerald-600 text-white rounded-lg py-3 font-semibold active:bg-emerald-700">💾 履歴に保存</button>
      <p class="text-xs text-slate-500">入力内容と計算結果を、日付・商品名つきで保存します。「履歴」タブで確認・再読込できます。</p>
    </section>
  </main>

  <!-- 履歴画面 -->
  <main id="view-hist" class="hidden p-3 max-w-2xl mx-auto space-y-3">
    <section class="bg-white rounded-xl shadow p-4 grid grid-cols-2 gap-3">
      <label class="block text-xs">商品で絞り込み
        <select id="histFilter" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-base bg-white"></select>
      </label>
      <label class="block text-xs">並び順
        <select id="histSort" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-base bg-white">
          <option value="desc">新しい順</option>
          <option value="asc">古い順</option>
        </select>
      </label>
    </section>
    <div id="histList" class="space-y-3"></div>
  </main>

  <!-- 設定・バックアップ画面 -->
  <main id="view-set" class="hidden p-3 max-w-2xl mx-auto space-y-4">
    <section class="bg-white rounded-xl shadow p-4 space-y-3">
      <h2 class="font-bold text-indigo-700">バックアップ</h2>
      <p class="text-xs text-slate-500">入力中の内容と履歴は、この端末のLocal Storageへ自動保存されます。端末移行やブラウザデータ削除に備えてエクスポートしてください。</p>
      <button id="btnExport" class="w-full bg-indigo-600 text-white rounded-lg py-3 font-semibold active:bg-indigo-700">バックアップを保存（履歴＋入力中の内容）</button>
      <button id="btnCsv" class="w-full bg-slate-600 text-white rounded-lg py-3 font-semibold active:bg-slate-700">履歴をCSVで保存（表計算用）</button>
      <div class="border-t pt-3 space-y-2">
        <p class="text-sm font-semibold">バックアップを復元（インポート）</p>
        <label class="flex items-start gap-2 text-sm"><input type="radio" name="impMode" value="merge" checked class="mt-1"><span>履歴にマージ（推奨）<br><span class="text-xs text-slate-500">既存の履歴を残し、バックアップの履歴を追加（同じIDは上書き）。入力中の内容は変更しません。</span></span></label>
        <label class="flex items-start gap-2 text-sm"><input type="radio" name="impMode" value="overwrite" class="mt-1"><span>すべて上書き<br><span class="text-xs text-slate-500">履歴と入力中の内容をバックアップの内容で置き換えます。</span></span></label>
        <input id="fileImport" type="file" accept=".json,application/json" class="block w-full text-sm file:mr-3 file:rounded-lg file:border-0 file:bg-slate-200 file:px-4 file:py-2">
      </div>
      <p id="msg" class="text-sm"></p>
    </section>
    <section class="bg-white rounded-xl shadow p-4 space-y-3">
      <h2 class="font-bold text-red-600">初期化</h2>
      <button id="btnReset" class="w-full bg-red-500 text-white rounded-lg py-3 font-semibold active:bg-red-600">入力内容をリセット（履歴は残す）</button>
      <button id="btnClearHist" class="w-full bg-red-700 text-white rounded-lg py-3 font-semibold active:bg-red-800">履歴をすべて削除</button>
    </section>
  </main>

  <!-- 判定結果 (Sticky) -->
  <aside id="result" class="fixed bottom-0 inset-x-0 z-30 bg-white border-t-2 border-indigo-300 shadow-[0_-4px_12px_rgba(0,0,0,.15)]" style="padding-bottom:env(safe-area-inset-bottom)">
    <div class="max-w-2xl mx-auto px-3 py-2">
      <div class="flex items-center gap-2">
        <span id="verdict" class="flex-1 min-w-0 truncate font-bold text-base rounded-lg px-3 py-1 bg-slate-200">-</span>
        <button id="btnQuickSave" class="shrink-0 bg-emerald-600 text-white text-sm rounded-lg px-3 py-2 active:bg-emerald-700">💾 保存</button>
        <button id="resToggle" class="shrink-0 text-xs text-slate-500 px-2 py-2">詳細 ▾</button>
      </div>
      <div id="resBody" class="mt-2 max-h-52 overflow-y-auto text-sm space-y-1"></div>
    </div>
  </aside>

  <div id="toast" class="hidden fixed top-20 inset-x-0 z-50 mx-auto w-max max-w-[90%] bg-slate-800 text-white text-sm rounded-lg px-4 py-2 shadow-lg"></div>

  <script src="script.js"></script>
</body>
</html>
