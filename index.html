<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TCG 箱買い期待値シミュレーター</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    .chev { transition: transform .2s; }
    .collapsed .chev { transform: rotate(-90deg); }
    .collapsed .body { display: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <header class="bg-indigo-600 text-white sticky top-0 z-20 shadow">
    <h1 class="px-4 pt-3 text-lg font-bold">TCG 箱買い期待値シミュレーター</h1>
    <nav class="flex mt-2">
      <button id="tab-sim" data-tab="sim" class="tab-btn flex-1 py-2 text-sm font-semibold border-b-4">シミュレーション</button>
      <button id="tab-set" data-tab="set" class="tab-btn flex-1 py-2 text-sm font-semibold border-b-4">設定・バックアップ</button>
    </nav>
  </header>

  <!-- シミュレーション画面 -->
  <main id="view-sim" class="p-3 pb-72 max-w-2xl mx-auto space-y-4">
    <section class="bg-white rounded-xl shadow p-4 space-y-3">
      <h2 class="font-bold text-indigo-700">① ボックスの基本設定</h2>
      <label class="block text-sm">1箱の購入価格（円）
        <input id="boxPrice" data-bind="box.price" type="number" pattern="\d*" inputmode="numeric" min="0" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-base">
      </label>
      <label class="block text-sm">未開封ボックスの現在のフリマ相場（円）
        <input id="boxFlea" data-bind="box.flea" type="number" pattern="\d*" inputmode="numeric" min="0" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-base">
      </label>
      <label class="block text-sm">開封する箱数
        <input id="boxCount" data-bind="box.count" type="number" pattern="\d*" inputmode="numeric" min="1" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-base">
      </label>
    </section>

    <section class="bg-white rounded-xl shadow p-4 space-y-3">
      <h2 class="font-bold text-indigo-700">② 販売コスト設定（フリマ）</h2>
      <div class="grid grid-cols-2 gap-3">
        <label class="block text-sm">手数料（%）
          <input id="fee" data-bind="cost.fee" type="number" pattern="\d*" inputmode="numeric" min="0" max="100" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-base">
        </label>
        <label class="block text-sm">送料・梱包費（円/件）
          <input id="ship" data-bind="cost.ship" type="number" pattern="\d*" inputmode="numeric" min="0" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-base">
        </label>
      </div>
    </section>

    <section class="space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="font-bold text-indigo-700">③ レアリティ枠の封入仕様</h2>
        <button id="addRarity" class="bg-indigo-600 text-white text-sm rounded-lg px-4 py-2 active:bg-indigo-700">＋追加</button>
      </div>
      <div id="rarities" class="space-y-4"></div>
    </section>
  </main>

  <!-- 設定・バックアップ画面 -->
  <main id="view-set" class="hidden p-3 max-w-2xl mx-auto space-y-4">
    <section class="bg-white rounded-xl shadow p-4 space-y-3">
      <h2 class="font-bold text-indigo-700">バックアップ</h2>
      <p class="text-xs text-slate-500">入力内容は自動的にこの端末のLocal Storageへ保存されます。</p>
      <button id="btnExport" class="w-full bg-indigo-600 text-white rounded-lg py-3 font-semibold active:bg-indigo-700">バックアップを保存（エクスポート）</button>
      <label class="block text-sm">バックアップを復元（インポート）
        <input id="fileImport" type="file" accept=".json,application/json" class="mt-1 block w-full text-sm file:mr-3 file:rounded-lg file:border-0 file:bg-slate-200 file:px-4 file:py-2">
      </label>
      <p id="msg" class="text-sm"></p>
    </section>
    <section class="bg-white rounded-xl shadow p-4 space-y-3">
      <h2 class="font-bold text-red-600">初期化</h2>
      <button id="btnReset" class="w-full bg-red-600 text-white rounded-lg py-3 font-semibold active:bg-red-700">一括リセット</button>
    </section>
  </main>

  <!-- 判定結果 (Sticky) -->
  <aside id="result" class="fixed bottom-0 inset-x-0 z-30 bg-white border-t-2 border-indigo-300 shadow-[0_-4px_12px_rgba(0,0,0,.15)]" style="padding-bottom:env(safe-area-inset-bottom)">
    <div class="max-w-2xl mx-auto px-3 py-2">
      <button id="resToggle" class="w-full flex items-center justify-between text-left">
        <span id="verdict" class="font-bold text-base rounded-lg px-3 py-1 bg-slate-200">-</span>
        <span class="text-xs text-slate-500">詳細 ▾</span>
      </button>
      <div id="resBody" class="mt-2 max-h-52 overflow-y-auto text-sm space-y-1"></div>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
